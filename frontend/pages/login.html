<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | PolarLog</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <a class="back" href="index.html">&larr; Back to PolarLog</a>
      <h1>Sign in to PolarLog</h1>
      <p class="muted">Access cargo, inventory, and station operations.</p>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <p class="error" role="alert"></p>
        <button class="button" type="submit">Continue to dashboard</button>
      </form>
    </main>
    <script src="../js/app.js"></script>
  </body>
</html>
