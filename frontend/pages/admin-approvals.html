        <div class="content">
          <style>
            .ap-list { display: flex; flex-direction: column; gap: 14px; max-width: 860px; }
            .ap-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
            .ap-name { font-size: 15px; font-weight: 700; }
            .ap-user { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
            .ap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 18px; margin: 14px 0; }
            .ap-label { font-size: 11.5px; color: var(--text-faint); margin-bottom: 3px; }
            .ap-value { font-size: 13px; color: var(--text); word-break: break-word; }
            .ap-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--border-soft); }
            .ap-role {
              background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
              border-radius: 9px; padding: 9px 12px; font-size: 12.5px; min-width: 170px;
            }
            .ap-actions .btn { cursor: pointer; }
            .ap-approve { background: var(--green-bg); color: var(--green); border-color: transparent; }
            .ap-approve:hover { background: var(--green); color: #fff; }
            .ap-reject:hover { background: var(--red-bg); color: var(--red); }
            .ap-actions .btn:disabled { opacity: 0.55; cursor: not-allowed; }
            .ap-state { font-size: 13px; color: var(--text-dim); padding: 6px 0; }
          </style>

    <script>
      (function () {
        // BASE's stored session user (set by login.js); never localStorage.
        var listEl = document.getElementById("apList");
        var toastWrap = document.getElementById("toastWrap");
        var ROLES = ["admin", "coordinator", "station_officer", "field_staff"];

        var user = null;
        try {
          user = JSON.parse(sessionStorage.getItem("polarlogDemoUser") || "null");
        } catch (err) {
          user = null;
        }

        function esc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        function state(msg) {
          listEl.innerHTML = '<div class="panel"><div class="ap-state">' + esc(msg) + "</div></div>";
        }
        function toast(msg, kind) {
          var t = document.createElement("div");
          t.className = "toast " + (kind || "success");
          t.textContent = msg;
          toastWrap.appendChild(t);
          setTimeout(function () { t.remove(); }, 3200);
        }

        // UX gate only - the server enforces admin-only on /api/admin/*.
        if (!user || user.role !== "admin") {
          state("This page is for administrators only.");
          return;
        }

        function field(label, value) {
          return '<div><div class="ap-label">' + esc(label) + '</div><div class="ap-value">' + value + "</div></div>";
        }

        function render(users) {
          if (!users.length) {
            state("No requests waiting. Everyone has been reviewed.");
            return;
          }
          listEl.innerHTML = users.map(function (u) {
            var preset = ROLES.indexOf(u.requested_role) !== -1 ? u.requested_role : "field_staff";
            var options = ROLES.map(function (r) {
              return '<option value="' + r + '"' + (r === preset ? " selected" : "") + ">" + r + "</option>";
            }).join("");
            return (
              '<div class="panel ap-card" data-id="' + esc(u.user_id) + '">' +
                '<div class="ap-head"><div>' +
                  '<div class="ap-name">' + esc(u.full_name || u.username) + "</div>" +
                  '<div class="ap-user">@' + esc(u.username) + "</div>" +
                "</div></div>" +
                '<div class="ap-grid">' +
                  field("Email", esc(u.email) || "—") +
                  field("Phone", esc(u.phone) || "—") +
                  field("Station", esc(u.station) || "—") +
                  field("Requested role", esc(u.requested_role) || "—") +
                "</div>" +
                '<div class="ap-actions">' +
                  '<select class="ap-role" aria-label="Role to grant">' + options + "</select>" +
                  '<button type="button" class="btn ap-approve">Approve</button>' +
                  '<button type="button" class="btn ap-reject">Reject</button>' +
                "</div>" +
              "</div>"
            );
          }).join("");

          listEl.querySelectorAll(".ap-card").forEach(function (card) {
            var id = card.getAttribute("data-id");
            card.querySelector(".ap-approve").addEventListener("click", function () {
              var role = card.querySelector(".ap-role").value;
              act(card, "approve", id, { role: role }, "Approved as " + role);
            });
            card.querySelector(".ap-reject").addEventListener("click", function () {
              act(card, "reject", id, {}, "Request rejected");
            });
          });
        }

        function act(card, action, id, body, doneMsg) {
          var buttons = card.querySelectorAll("button");
          buttons.forEach(function (b) { b.disabled = true; });
          // Plain fetch (not apiSend): an approval must not be queued offline.
          fetch(API_BASE + "/api/admin/" + action + "/" + encodeURIComponent(id), {
            method: "PUT",
            headers: authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify(body),
          })
            .then(function (r) {
              if (r.status === 401) { handleUnauthorized(); return null; }
              return r.json().catch(function () { return {}; }).then(function (b) {
                return { ok: r.ok, body: b };
              });
            })
            .then(function (res) {
              if (res === null) return;
              if (!res.ok) {
                buttons.forEach(function (b) { b.disabled = false; });
                return toast(res.body.error || "That did not work. Try again.", "err");
              }
              toast(doneMsg, "success");
              card.remove();
              if (!listEl.querySelector(".ap-card")) {
                state("No requests waiting. Everyone has been reviewed.");
              }
            })
            .catch(function () {
              buttons.forEach(function (b) { b.disabled = false; });
              toast("Could not reach the server.", "err");
            });
        }

        fetch(API_BASE + "/api/admin/pending-users", { headers: authHeaders() })
          .then(function (r) {
            if (r.status === 401) { handleUnauthorized(); return null; }
            if (r.status === 403) { state("You do not have permission to view this page."); return null; }
            if (!r.ok) { state("Could not load requests (" + r.status + ")."); return null; }
            return r.json();
          })
          .then(function (body) {
            if (body === null) return;
            render(Array.isArray(body) ? body : []);
          })
          .catch(function () {
            state("Could not reach the server. Is the backend running?");
          });
      })();
    </script>
