<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password – PolarLog</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/design-system.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#03111f" />
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
    <style>
      /* Small additions for the public auth pages; everything else comes
         from design-system.css + login.css. */
      .login-shell { max-width: 440px; }
      .login-field select {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: var(--text-primary);
        padding: 11px 12px;
        border-radius: var(--radius-sm);
        outline: none;
        font-size: 13.5px;
        font-family: var(--font-main);
      }
      .login-field select:focus { border-color: var(--polar-ice); }
      .login-field select option { background: var(--bg-surface); color: var(--text-primary); }
      .login-hint { font-size: 11.5px; color: var(--text-muted); }
      .login-ok {
        display: none;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid var(--success);
        color: #86efac;
        font-size: 12px;
        padding: 9px 11px;
        border-radius: var(--radius-sm);
        margin-bottom: 16px;
      }
      .login-ok.show { display: block; }
      .login-step { display: none; }
      .login-step.active { display: block; }
      .login-card p.lead { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <a href="index.html" class="login-brand">
        <div class="login-brand-mark">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M12 2v20M4.5 6l15 12M19.5 6l-15 12M2 12h20" />
          </svg>
        </div>
        <div class="login-brand-text">
          <div class="name">POLARLOG</div>
          <div class="tag">Integrated Polar Expedition Logistics</div>
        </div>
      </a>

      <div class="login-card">
        <h1>Reset your password</h1>
        <p class="sub">We email a 6-digit code that works for 10 minutes.</p>

        <div class="login-error" id="fpError" role="alert"></div>
        <div class="login-ok" id="fpOk" role="status"></div>

        <div class="login-step active" id="stepEmail">
          <form id="emailForm" novalidate>
            <div class="login-field">
              <label for="email">Email</label>
              <input type="email" id="email" autocomplete="email" />
            </div>
            <button type="submit" class="login-submit" id="sendBtn">Send code</button>
          </form>
        </div>

        <div class="login-step" id="stepReset">
          <form id="resetForm" novalidate>
            <p class="lead">Enter the code from your email and choose a new password.</p>
            <div class="login-field">
              <label for="otp">6-digit code</label>
              <input type="text" id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
            </div>
            <div class="login-field">
              <label for="newPassword">New password</label>
              <input type="password" id="newPassword" autocomplete="new-password" />
              <span class="login-hint">At least 8 characters.</span>
            </div>
            <button type="submit" class="login-submit" id="resetBtn">Save new password</button>
          </form>
        </div>

        <div class="login-footer-link">
          <a href="login.html">Back to sign in</a>
        </div>
      </div>
    </div>

    <script src="../js/offline-db.js"></script>
    <script src="../js/config.js"></script>
    <script>
      (function () {
        var errBox = document.getElementById("fpError");
        var okBox = document.getElementById("fpOk");

        function showError(msg) {
          okBox.classList.remove("show");
          errBox.textContent = msg;
          errBox.classList.add("show");
        }
        function showOk(msg) {
          errBox.classList.remove("show");
          okBox.textContent = msg;
          okBox.classList.add("show");
        }
        function showStep(id) {
          document.querySelectorAll(".login-step").forEach(function (s) {
            s.classList.remove("active");
          });
          document.getElementById(id).classList.add("active");
        }
        function post(path, payload) {
          // Plain fetch (not apiSend): never queue a reset offline.
          return fetch(API_BASE + path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          }).then(function (r) {
            return r.json().then(function (body) {
              return { ok: r.ok, body: body };
            });
          });
        }

        document.getElementById("emailForm").addEventListener("submit", function (e) {
          e.preventDefault();
          errBox.classList.remove("show");
          var email = document.getElementById("email").value.trim();
          if (!email) return showError("Enter your email address.");
          var btn = document.getElementById("sendBtn");
          btn.disabled = true;
          btn.textContent = "Sending…";
          post("/api/auth/forgot-password", { email: email })
            .then(function (res) {
              if (!res.ok) return showError(res.body.error || "Something went wrong. Try again.");
              showOk(res.body.message);
              showStep("stepReset");
            })
            .catch(function () { showError("Could not reach the server. Is the backend running?"); })
            .finally(function () { btn.disabled = false; btn.textContent = "Send code"; });
        });

        document.getElementById("resetForm").addEventListener("submit", function (e) {
          e.preventDefault();
          errBox.classList.remove("show");
          var email = document.getElementById("email").value.trim();
          var otp = document.getElementById("otp").value.trim();
          var newPassword = document.getElementById("newPassword").value;
          if (!otp || !newPassword) return showError("Enter the code and a new password.");
          if (newPassword.length < 8) return showError("Password must be at least 8 characters.");
          var btn = document.getElementById("resetBtn");
          btn.disabled = true;
          btn.textContent = "Saving…";
          post("/api/auth/reset-password", { email: email, otp: otp, new_password: newPassword })
            .then(function (res) {
              if (!res.ok) return showError(res.body.error || "Something went wrong. Try again.");
              showOk((res.body.message || "Password updated.") + " Taking you to sign in…");
              setTimeout(function () { window.location.href = "login.html"; }, 2000);
            })
            .catch(function () { showError("Could not reach the server. Is the backend running?"); })
            .finally(function () { btn.disabled = false; btn.textContent = "Save new password"; });
        });
      })();
    </script>
    <script src="../js/pwa-register.js"></script>
  </body>
</html>
