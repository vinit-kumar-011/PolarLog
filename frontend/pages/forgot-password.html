<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password – PolarLog</title>
    <link rel="stylesheet" href="../css/login.css" />
    <style>
      .step { display: none; }
      .step.active { display: block; }
      .msg {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
        display: none;
      }
      .msg.show { display: block; }
      .msg.err { background: rgba(239, 68, 68, 0.12); color: #fca5a5; }
      .msg.ok  { background: rgba(34, 197, 94, 0.12); color: #86efac; }
      .back-link {
        display: block;
        text-align: center;
        margin-top: 18px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <h1>Reset your password</h1>

        <!-- Step 1: ask for the email -->
        <div class="step active" id="stepEmail">
          <p>Enter your email and we'll send you a code.</p>
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
          <button class="login-submit" id="sendBtn">Send code</button>
        </div>

        <!-- Step 2: code plus new password -->
        <div class="step" id="stepReset">
          <p>Check your inbox and enter the 6-digit code.</p>
          <label for="otp">Code</label>
          <input type="text" id="otp" maxlength="6" placeholder="123456" />
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" placeholder="At least 8 characters" />
          <button class="login-submit" id="resetBtn">Set new password</button>
        </div>

        <div class="msg" id="msgBox"></div>

        <a class="back-link" href="login.html">&larr; Back to sign in</a>
      </div>
    </div>

    <script src="../js/config.js"></script>
    <script>
      (function () {
        var msgBox = document.getElementById("msgBox");

        function say(text, isError) {
          msgBox.textContent = text;
          msgBox.className = "msg show " + (isError ? "err" : "ok");
        }

        function showStep(id) {
          document.querySelectorAll(".step").forEach(function (s) {
            s.classList.remove("active");
          });
          document.getElementById(id).classList.add("active");
        }

        document.getElementById("sendBtn").addEventListener("click", function () {
          var email = document.getElementById("email").value.trim();
          if (!email) return say("Enter your email address.", true);

          this.disabled = true;
          this.textContent = "Sending…";

          var btn = this;
          fetch(API_BASE + "/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email }),
          })
            .then(function (r) { return r.json(); })
            .then(function (body) {
              if (body.error) return say(body.error, true);
              say(body.message, false);
              showStep("stepReset");
            })
            .catch(function () {
              say("Could not reach the server.", true);
            })
            .finally(function () {
              btn.disabled = false;
              btn.textContent = "Send code";
            });
        });

        document.getElementById("resetBtn").addEventListener("click", function () {
          var email = document.getElementById("email").value.trim();
          var otp = document.getElementById("otp").value.trim();
          var newPassword = document.getElementById("newPassword").value;

          if (!otp || !newPassword) {
            return say("Enter the code and a new password.", true);
          }
          if (newPassword.length < 8) {
            return say("Password must be at least 8 characters.", true);
          }

          this.disabled = true;
          this.textContent = "Saving…";

          var btn = this;
          fetch(API_BASE + "/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: email,
              otp: otp,
              new_password: newPassword,
            }),
          })
            .then(function (r) { return r.json(); })
            .then(function (body) {
              if (body.error) return say(body.error, true);
              say(body.message + " Redirecting…", false);
              setTimeout(function () {
                window.location.href = "login.html";
              }, 2000);
            })
            .catch(function () {
              say("Could not reach the server.", true);
            })
            .finally(function () {
              btn.disabled = false;
              btn.textContent = "Set new password";
            });
        });
      })();
    </script>
  </body>
</html>
